{% extends 'base.html' %}
{% block title %}Confirm Deletion - Kaes Library{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-7 col-lg-5">
        <div class="glass-panel p-4 p-md-5 text-center border-top border-4 border-danger">
            <div class="stat-icon danger mx-auto mb-3" style="width: 64px; height: 64px; font-size: 28px;">
                <i class="fas fa-triangle-exclamation"></i>
            </div>
            <h4 class="fw-bold mb-2">Confirm Record Deletion</h4>
            <p class="text-muted mb-4">
                Are you sure you want to permanently delete: <br>
                <strong class="text-danger">{{ object_name }}</strong>?
            </p>

            <form method="POST">
                {% csrf_token %}
                <div class="d-flex justify-content-center gap-3">
                    <a href="{% url cancel_url %}" class="btn btn-secondary rounded-pill px-4">Cancel</a>
                    <button type="submit" class="btn btn-danger rounded-pill px-4">
                        <i class="fas fa-trash me-1"></i> Yes, Delete Permanently
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
